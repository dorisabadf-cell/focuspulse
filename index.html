<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FocusPulse AI - Productividad Visual</title>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --card-hover: #334155;
  --text: #f8fafc;
  --muted: #94a3b8;
  --line: #334155;
  --accent: #10b981;
  --accent-light: #34d399;
  --accent-bg: rgba(16, 185, 129, 0.1);
  --danger: #ef4444;
  --warning: #f59e0b;
  --info: #3b82f6;
  --radius: 12px;
  --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

[data-theme="light"] {
  --bg: #f8fafc;
  --card: #ffffff;
  --card-hover: #f1f5f9;
  --text: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --accent: #059669;
  --accent-light: #10b981;
  --accent-bg: rgba(5, 150, 105, 0.1);
  --danger: #dc2626;
  --warning: #d97706;
  --info: #2563eb;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.5; min-height: 100vh; padding-bottom: 40px; }

header {
  position: sticky; top: 0; z-index: 50; background: var(--bg);
  border-bottom: 1px solid var(--line); backdrop-filter: blur(8px);
}
.wrap { max-width: 800px; margin: 0 auto; padding: 0 16px; }

.header-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }
.logo { font-size: 20px; font-weight: 800; color: var(--accent-light); display: flex; align-items: center; gap: 8px; }
.header-actions { display: flex; gap: 8px; align-items: center; }

nav { display: flex; gap: 4px; padding-bottom: 10px; overflow-x: auto; }
nav button {
  padding: 8px 14px; border: 1px solid transparent; background: transparent;
  color: var(--muted); border-radius: 8px; font: inherit; font-weight: 600; font-size: 14px;
  cursor: pointer; white-space: nowrap; transition: all 0.2s;
}
nav button:hover { color: var(--text); background: var(--card-hover); }
nav button.on { background: var(--accent-bg); color: var(--accent-light); border-color: var(--accent); }

.daily-progress {
  display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
  color: var(--muted); background: var(--card); padding: 6px 12px; border-radius: 20px;
  border: 1px solid var(--line);
}
.daily-progress span { color: var(--accent-light); font-weight: 700; }

.box { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 16px 0; display: flex; flex-direction: column; gap: 10px; }
.input-row { display: flex; gap: 8px; flex-wrap: wrap; }
input, select {
  font: inherit; font-size: 14px; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; outline: none;
}
input[type="text"] { flex: 1 1 180px; }
input:focus, select:focus { border-color: var(--accent); }

.btn {
  font: inherit; font-size: 14px; font-weight: 600; background: var(--accent);
  color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; transition: opacity 0.2s;
}
.btn:hover { opacity: 0.9; }

.item {
  display: flex; align-items: flex-start; gap: 12px; background: var(--card);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
  transition: border-color 0.2s;
}
.item:hover { border-color: var(--muted); }
.item.done { opacity: 0.6; }
.item.done .title { text-decoration: line-through; color: var(--muted); }
.item-content { flex: 1; min-width: 0; }
.title { font-weight: 600; color: var(--text); margin-bottom: 4px; word-break: break-word; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); margin-top: 6px; }

.badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; background: var(--accent-bg); color: var(--accent-light); text-transform: uppercase; }
.time-tag { color: var(--accent-light); font-weight: 600; }

.btn-icon { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; padding: 2px 6px; }
.btn-icon:hover { color: var(--text); }
.btn-icon.danger:hover { color: var(--danger); }

.empty { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 14px; }

.proj-card {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 10px; transition: border-color 0.2s;
}
.proj-card:hover { border-color: var(--muted); }
.proj-title { font-weight: 700; font-size: 15px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.proj-stats { font-size: 12px; color: var(--muted); display: flex; gap: 12px; margin-top: 2px; }
.proj-stats span { color: var(--accent-light); font-weight: 600; }

.calh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; text-transform: capitalize; font-weight: 700; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 16px; }
.dow { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 0; font-weight: 600; }
.day { font: inherit; min-height: 50px; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; cursor: pointer; }
.day i { font-style: normal; font-size: 10px; line-height: 1; color: var(--accent-light); letter-spacing: 1px; }
.day.hoy { border-color: var(--accent); font-weight: 700; }
.day.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
.day.sel i { color: #fff; }

.focus-view { text-align: center; padding: 40px 16px; }
.timer { font-size: 64px; font-weight: 800; font-family: monospace; color: var(--accent-light); margin: 20px 0; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="header-top">
      <div class="logo">⚡ FocusPulse</div>
      <div class="header-actions">
        <div class="daily-progress" id="dailyProgress">
          Hoy: <span id="progressCount">0/0</span> (<span id="progressPct">0%</span>)
        </div>
        <button class="btn-icon" id="themeBtn" title="Cambiar tema">🌙</button>
      </div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<main class="wrap" id="view"></main>

<script>
var KEY = "focuspulse_main";
var S = { tasks: [], projects: [], theme: "dark" };
var tab = "today";

try {
  var keysToTry = ["focuspulse_main", "focuspulse_v9", "focuspulse_v8", "focuspulse_v7", "focuspulse_v6", "focuspulse_v5", "focuspulse_v4", "focuspulse_v3"];
  var allTasks = [];
  var allProjects = [];
  var chosenTheme = "dark";

  keysToTry.forEach(function(k) {
    var raw = localStorage.getItem(k);
    if (raw) {
      var data = JSON.parse(raw);
      if (data.tasks && Array.isArray(data.tasks)) {
        data.tasks.forEach(function(t) {
          if (!allTasks.some(function(x){ return x.id === t.id || x.title === t.title; })) {
            allTasks.push(t);
          }
        });
      }
      if (data.projects && Array.isArray(data.projects)) {
        data.projects.forEach(function(p) {
          if (allProjects.indexOf(p) === -1) {
            allProjects.push(p);
          }
        });
      }
      if (data.theme) chosenTheme = data.theme;
    }
  });

  S.tasks = allTasks;
  S.projects = allProjects;
  S.theme = chosenTheme;
  save();
} catch (e) {}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  updateProgress();
}

function uid() { return Math.random().toString(36).slice(2, 9); }
function iso(d) {
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function sortTasks(tasks) {
  return tasks.sort(function(a, b) {
    var timeA = a.time || "23:59";
    var timeB = b.time || "23:59";
    return timeA.localeCompare(timeB);
  });
}

function updateProgress() {
  var hoy = iso(new Date());
  var hoyTasks = S.tasks.filter(function(t){ return t.due === hoy; });
  var hechas = hoyTasks.filter(function(t){ return t.done; }).length;
  var total = hoyTasks.length;
  var pct = total > 0 ? Math.round((hechas / total) * 100) : 0;
  
  var pcEl = document.getElementById("progressCount");
  var ppEl = document.getElementById("progressPct");
  if (pcEl && ppEl) {
    pcEl.innerText = hechas + "/" + total;
    ppEl.innerText = pct + "%";
  }
}

function renderNav() {
  var nav = document.getElementById("nav");
  if (!nav) return;
  nav.innerHTML = "";
  var tabs = [
    ["today", "Hoy"],
    ["projects", "Proyectos"],
    ["cal", "Calendario"],
    ["focus", "Modo Enfoque"]
  ];
  tabs.forEach(function(t) {
    var btn = document.createElement("button");
    btn.className = tab === t[0] ? "on" : "";
    btn.innerText = t[1];
    btn.onclick = function() { 
      if (timerInterval) resetTimer();
      tab = t[0]; 
      render(); 
    };
    nav.appendChild(btn);
  });
}

function getProjectOptions() {
  if (!S.projects.length) return '<option value="General">General</option>';
  return S.projects.map(function(p){ return '<option value="' + p + '">' + p + '</option>'; }).join("");
}

function renderToday() {
  var view = document.getElementById("view");
  var projOpts = getProjectOptions();
  var hoyIso = iso(new Date());
  
  view.innerHTML = '<div class="box">' +
    '<div class="input-row">' +
      '<input type="text" id="newTask" placeholder="¿Qué necesitas hacer?">' +
      '<input type="date" id="taskDate" value="' + hoyIso + '">' +
      '<input type="time" id="taskTime">' +
      '<select id="taskProj">' + projOpts + '</select>' +
      '<button class="btn" onclick="addTodayTask()">Agregar</button>' +
    '</div>' +
  '</div>' +
  '<div id="taskList"></div>';
  renderTaskList();
}

function addTodayTask() {
  var input = document.getElementById("newTask");
  var dateInput = document.getElementById("taskDate");
  var timeInput = document.getElementById("taskTime");
  var projSelect = document.getElementById("taskProj");
  var txt = input.value.trim();
  if (!txt) return;

  S.tasks.push({
    id: uid(),
    title: txt,
    due: dateInput ? dateInput.value : iso(new Date()),
    time: timeInput ? timeInput.value : "",
    project: projSelect ? projSelect.value : "General",
    done: false
  });
  save();
  input.value = "";
  renderToday();
}

function renderTaskList() {
  var list = document.getElementById("taskList");
  if (!list) return;
  var hoy = iso(new Date());
  var items = sortTasks(S.tasks.filter(function(t){ return t.due === hoy; }));

  if (!items.length) {
    list.innerHTML = '<div class="empty">No tienes tareas pendientes para hoy. ¡Disfruta tu día!</div>';
    return;
  }

  list.innerHTML = "";
  items.forEach(function(t) {
    var el = document.createElement("div");
    el.className = "item" + (t.done ? " done" : "");
    var timeHtml = t
